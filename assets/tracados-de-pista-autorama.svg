  </g>
  <g fill="none" stroke="#1b493f" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 260 C85 170 125 125 205 125 C285 125 325 170 325 260 C325 350 285 395 205 395 C125 395 85 350 85 260Z"/>
    <path d="M480 260 C480 160 535 125 600 125 C665 125 720 160 720 260 C720 360 665 395 600 395 C535 395 480 360 480 260Z"/>
