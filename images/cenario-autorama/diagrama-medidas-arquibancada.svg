<text x="62" y="425" font-family="Arial,sans-serif" font-size="17" fill="#1e2825">Mureta de</text><text x="62" y="449" font-family="Arial,sans-serif" font-size="17" fill="#1e2825">proteção</text><text x="62" y="473" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#c73935">1 a 1,5 cm</text>
<text x="185" y="620" font-family="Arial,sans-serif" font-size="16" fill="#68716d">Medidas aproximadas para escala 1/32; adapte ao espaço e às peças disponíveis.</text>
