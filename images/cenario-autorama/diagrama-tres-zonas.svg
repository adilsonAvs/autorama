<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Três zonas ao redor de uma pista de autorama</title><desc id="desc">Diagrama superior de uma pista oval, com zonas de segurança, decoração e fundo, além de três pontos de saída marcados com X vermelho.</desc>
<rect width="1200" height="700" rx="28" fill="#f7f7f2"/>
<text x="60" y="62" fill="#1e2825" font-family="Arial,sans-serif" font-size="30" font-weight="700">Organização do cenário em três zonas</text>
<ellipse cx="530" cy="340" rx="430" ry="220" fill="#dce9df" stroke="#93aa98" stroke-width="3"/>
<ellipse cx="530" cy="340" rx="350" ry="172" fill="#eadfc8" stroke="#c3a77a" stroke-width="3"/>
<ellipse cx="530" cy="340" rx="274" ry="126" fill="#f3e4ad" stroke="#c8ab57" stroke-width="3"/>
<ellipse cx="530" cy="340" rx="215" ry="82" fill="#45534d" stroke="#27352f" stroke-width="5"/>
<ellipse cx="530" cy="340" rx="156" ry="42" fill="#f7f7f2" stroke="#75837b" stroke-width="3"/>
<path d="M340 340h380" stroke="#f7f7f2" stroke-width="3" stroke-dasharray="16 13" opacity=".7"/>
<g stroke="#c73935" stroke-width="11" stroke-linecap="round"><path d="m300 210 34 34m0-34-34 34"/><path d="m740 435 34 34m0-34-34 34"/><path d="m800 235 34 34m0-34-34 34"/></g>
<g font-family="Arial,sans-serif" font-size="22" fill="#1e2825"><text x="92" y="592">A área cresce conforme se afasta da pista</text></g>
<g transform="translate(790 145)" font-family="Arial,sans-serif" fill="#1e2825">
 <rect x="0" y="0" width="340" height="360" rx="18" fill="#fff" stroke="#dfe2d8" stroke-width="2"/>
 <text x="28" y="42" font-size="22" font-weight="700">Legenda</text>
 <rect x="28" y="70" width="30" height="24" rx="4" fill="#f3e4ad" stroke="#c8ab57"/><text x="74" y="89" font-size="18">Zona de segurança (10 a 15 cm)</text>
 <rect x="28" y="125" width="30" height="24" rx="4" fill="#eadfc8" stroke="#c3a77a"/><text x="74" y="144" font-size="18">Zona de decoração</text>
 <rect x="28" y="180" width="30" height="24" rx="4" fill="#dce9df" stroke="#93aa98"/><text x="74" y="199" font-size="18">Zona de fundo</text>
 <path d="m32 246 25 25m0-25-25 25" stroke="#c73935" stroke-width="7" stroke-linecap="round"/><text x="74" y="266" font-size="18">Ponto de saída de curva</text>
 <text x="28" y="320" font-size="15" fill="#68716d">Deixe os pontos de saída livres.</text>
</g></svg>