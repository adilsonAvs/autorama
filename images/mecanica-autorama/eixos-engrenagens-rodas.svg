<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Funções dos eixos, engrenagens e rodas no autorama</title><desc id="desc">Vista esquemática de um carrinho com eixo dianteiro de apoio e eixo traseiro ligado à transmissão e às rodas motrizes.</desc><rect width="1200" height="675" fill="#f6f5ef"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#557269">PEÇAS DIFERENTES, FUNÇÕES DISTINTAS</text><path d="M180 305 Q250 210 390 210h425q130 0 200 95v88q-67 100-200 100H390q-142 0-210-100z" fill="#e8eee5" stroke="#1b493f" stroke-width="8"/><path d="M375 300v205M860 300v205" stroke="#557269" stroke-width="13"/><path d="M290 377h740" stroke="#1b493f" stroke-width="16"/><path d="M760 377v-95" stroke="#e87842" stroke-width="12"/><circle cx="760" cy="278" r="53" fill="#d5ed84" stroke="#1b493f" stroke-width="8"/><circle cx="290" cy="400" r="70" fill="#202a25"/><circle cx="290" cy="400" r="33" fill="#d5ed84"/><circle cx="1030" cy="400" r="70" fill="#202a25"/><circle cx="1030" cy="400" r="33" fill="#d5ed84"/><circle cx="375" cy="400" r="52" fill="#202a25"/><circle cx="375" cy="400" r="24" fill="#fff"/><circle cx="860" cy="400" r="52" fill="#202a25"/><circle cx="860" cy="400" r="24" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#202a25"><text x="230" y="525" font-size="23" font-weight="700">EIXO DIANTEIRO</text><text x="230" y="555" font-size="18" fill="#58665d">apoia / orienta conforme o chassi</text><text x="690" y="525" font-size="23" font-weight="700">EIXO TRASEIRO</text><text x="690" y="555" font-size="18" fill="#58665d">pode receber a engrenagem motriz</text><path d="M455 508v-55m75 55V445m277 0v-60" stroke="#e87842" stroke-width="4"/><text x="492" y="606" text-anchor="middle" font-size="17" fill="#58665d">Rodas sustentam o contato com a pista</text><text x="925" y="607" text-anchor="middle" font-size="17" fill="#58665d">Engrenagens transmitem rotação e força</text></g></svg>
