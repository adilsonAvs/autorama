<path d="M632 327h75" stroke="#e87842" stroke-width="13" stroke-linecap="round"/><path d="m692 307 34 20-34 20" fill="#e87842"/><circle cx="790" cy="327" r="90" fill="#fff" stroke="#1b493f" stroke-width="13" stroke-dasharray="12 7"/><circle cx="790" cy="327" r="25" fill="#c9e866" stroke="#1b493f" stroke-width="8"/><circle cx="790" cy="327" r="8" fill="#1b493f"/><text x="790" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#202a25">ENGRENAGEM</text><text x="790" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#58665d">no eixo motriz</text>
