<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Sequência segura para inspecionar a transmissão</title><desc id="desc">Quatro etapas: desligar, observar, girar as rodas suavemente e consultar o manual antes de remontar.</desc><rect width="1200" height="520" fill="#f6f5ef"/><text x="70" y="75" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#557269">INSPEÇÃO SEM DESMONTAGEM DESNECESSÁRIA</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(75 140)"><rect width="240" height="270" rx="20" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="120" cy="75" r="38" fill="#d5ed84"/><text x="120" y="87" font-size="35" font-weight="700" fill="#1b493f">1</text><text x="120" y="158" font-size="24" font-weight="700" fill="#202a25">Desligue</text><text x="120" y="198" font-size="18" fill="#58665d">retire o carro</text><text x="120" y="225" font-size="18" fill="#58665d">da pista e corte</text><text x="120" y="252" font-size="18" fill="#58665d">a alimentação</text></g>
<g transform="translate(355 140)"><rect width="240" height="270" rx="20" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="120" cy="75" r="38" fill="#d5ed84"/><text x="120" y="87" font-size="35" font-weight="700" fill="#1b493f">2</text><text x="120" y="158" font-size="24" font-weight="700" fill="#202a25">Observe</text><text x="120" y="198" font-size="18" fill="#58665d">procure fios,</text><text x="120" y="225" font-size="18" fill="#58665d">sujeira e dentes</text><text x="120" y="252" font-size="18" fill="#58665d">danificados</text></g>
<g transform="translate(635 140)"><rect width="240" height="270" rx="20" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="120" cy="75" r="38" fill="#d5ed84"/><text x="120" y="87" font-size="35" font-weight="700" fill="#1b493f">3</text><text x="120" y="158" font-size="24" font-weight="700" fill="#202a25">Gire devagar</text><text x="120" y="198" font-size="18" fill="#58665d">só as rodas, sem</text><text x="120" y="225" font-size="18" fill="#58665d">forçar o conjunto</text><text x="120" y="252" font-size="18" fill="#58665d">ou abrir o motor</text></g>
<g transform="translate(915 140)"><rect width="240" height="270" rx="20" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="120" cy="75" r="38" fill="#d5ed84"/><text x="120" y="87" font-size="35" font-weight="700" fill="#1b493f">4</text><text x="120" y="158" font-size="24" font-weight="700" fill="#202a25">Consulte</text><text x="120" y="198" font-size="18" fill="#58665d">manual e peças</text><text x="120" y="225" font-size="18" fill="#58665d">compatíveis antes</text><text x="120" y="252" font-size="18" fill="#58665d">de intervir</text></g></g><path d="M318 275h30m247 0h30m247 0h30" stroke="#e87842" stroke-width="8" stroke-linecap="round"/><path d="m339 260 18 15-18 15m259-30 18 15-18 15m259-30 18 15-18 15" fill="none" stroke="#e87842" stroke-width="7" stroke-linejoin="round"/></svg>
