<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Comparação entre eixo, engrenagem e roda</title><desc id="desc">Três componentes ilustrados separadamente: eixo como barra de apoio, engrenagens como peças que transmitem rotação e roda com pneu em contato com a pista.</desc><rect width="1200" height="520" fill="#f6f5ef"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#557269">COMO DIFERENCIAR NA INSPEÇÃO</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(95 115)"><rect width="290" height="330" rx="18" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><path d="M55 125h180" stroke="#1b493f" stroke-width="16" stroke-linecap="round"/><circle cx="70" cy="125" r="25" fill="#d5ed84" stroke="#1b493f" stroke-width="7"/><circle cx="220" cy="125" r="25" fill="#d5ed84" stroke="#1b493f" stroke-width="7"/><text x="145" y="210" font-size="25" font-weight="700" fill="#202a25">EIXO</text><text x="145" y="250" font-size="18" fill="#58665d">alinha e sustenta</text><text x="145" y="278" font-size="18" fill="#58665d">rodas; pode girar</text><text x="145" y="306" font-size="18" fill="#58665d">com elas</text></g>
<g transform="translate(455 115)"><rect width="290" height="330" rx="18" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="145" cy="125" r="63" fill="#d5ed84" stroke="#1b493f" stroke-width="10" stroke-dasharray="12 6"/><circle cx="145" cy="125" r="19" fill="#fff" stroke="#1b493f" stroke-width="7"/><text x="145" y="210" font-size="25" font-weight="700" fill="#202a25">ENGRENAGEM</text><text x="145" y="250" font-size="18" fill="#58665d">transfere movimento</text><text x="145" y="278" font-size="18" fill="#58665d">entre eixos que</text><text x="145" y="306" font-size="18" fill="#58665d">se acoplam</text></g>
<g transform="translate(815 115)"><rect width="290" height="330" rx="18" fill="#fff" stroke="#dfe2d8" stroke-width="3"/><circle cx="145" cy="125" r="64" fill="#202a25"/><circle cx="145" cy="125" r="34" fill="#d5ed84"/><circle cx="145" cy="125" r="12" fill="#1b493f"/><path d="M145 64v122M84 125h122" stroke="#f6f5ef" stroke-width="5"/><text x="145" y="210" font-size="25" font-weight="700" fill="#202a25">RODA + PNEU</text><text x="145" y="250" font-size="18" fill="#58665d">apoia o carrinho</text><text x="145" y="278" font-size="18" fill="#58665d">e encontra a</text><text x="145" y="306" font-size="18" fill="#58665d">superfície da pista</text></g></g></svg>
